<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nii palju tähendusi!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Nii palju <em>tähendusi!</em></h1>
    <span class="byline">Kati Murutar · <span id="total"></span> mitmetähenduslikku sõna</span>
  </header>

  <nav class="tabs" role="tablist" aria-label="Mänguviis">
    <button class="tab" role="tab" id="tab-w2m" aria-selected="true">Sõnast tähendusteni</button>
    <button class="tab" role="tab" id="tab-m2w" aria-selected="false">Tähendustest sõnani</button>
    <button class="tab" role="tab" id="tab-list" aria-selected="false">Kõik sõnad</button>
  </nav>

  <section id="game">
    <div class="status" aria-live="polite">
      <span class="pill">Küsimus <b id="qn">1</b>/<b id="qt">10</b></span>
      <span class="pill">Õigeid <b id="sc">0</b></span>
      <span class="pill">Seeria <b id="st">0</b></span>
    </div>
    <div style="height:12px"></div>
    <div class="cardbox" id="card">
      <span class="corner tl" id="ctl">NPT</span>
      <span class="corner br" id="cbr">NPT</span>
      <div class="prompt" id="prompt"></div>
      <div id="face"></div>
    </div>
    <div style="height:14px"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="row"><button class="btn" id="next" hidden>Järgmine</button></div>
  </section>

  <section id="end" class="end" hidden>
    <div class="prompt">Voor läbi</div>
    <div class="score" id="final">0/10</div>
    <div id="verdict"></div>
    <div class="row">
      <button class="btn" id="again">Uus voor</button>
      <button class="btn ghost" id="switch">Vaheta mänguviisi</button>
    </div>
  </section>

  <section id="browse" hidden>
    <label for="q" class="prompt" style="display:block;text-align:left;margin-bottom:6px">Otsi sõna või tähendust</label>
    <input id="q" class="search" type="search" placeholder="näiteks: pea, tagatis, kehaosa" autocomplete="off">
    <div style="height:12px"></div>
    <div class="list" id="list"></div>
  </section>

  <footer>Alusversioon · Unleashed Publishing · In service of art.</footer>
</div>

<script src="data/words.js"></script>
<script src="js/app.js"></script>
</body>
</html>
